# avaXLand / contracts
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"        # Avalanche C-Chain 自 Etna 起支持 Cancun；OZ 5.x 用到 mcopy
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./test/vectors" }]

[fmt]
line_length = 120
tab_width = 4

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
