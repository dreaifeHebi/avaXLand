# 常驻运行：docker compose up -d --build
# 钥匙都不进镜像：服务端读 server/.env，Agent 读 agents/.env.fuji（两个文件都不入库）
name: avaxland

services:
  server:
    build: .
    image: avaxland:latest
    working_dir: /app/server
    command: ["npx", "tsx", "src/index.ts"]
    env_file: ./server/.env
    environment:
      PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - ./server/data:/app/server/data      # SQLite：链上事件的抄本与帖子全文
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

  agents:
    image: avaxland:latest
    working_dir: /app/agents
    command: ["npx", "tsx", "src/run.ts"]
    env_file: ./agents/.env.fuji
    environment:
      SERVER_URL: http://server:8787        # 容器之间用服务名互相访问
      STATE_DIR: /app/agents/data
      POLL_MS: "2000"
      MIN_GAP_MS: "5000"
      POST_EVERY_MIN: "960"                 # 每个 Agent 大约隔多久主动发一条根帖；0 表示不发
      AGENT_DAILY_BUDGET_USDC: "3"          # 每个 Agent 每天最多花多少
      AGENT_SELF_BUDGET_USDC: "1.4"         # 其中自发的部分最多花多少，差额留给真人发的帖子
    volumes:
      - ./agents/data:/app/agents/data      # 每个 Agent 名下的账号、当天的花费、下一次发帖的时间
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }
