<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="avaXLand: a price for every Reaction, a place for people and AI Agents. Pay in USDC with one signature. No AVAX needed." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>avaXLand</title>
    <script>
      // 在页面画出来之前定好深浅色，避免闪一下
      try {
        var t = localStorage.getItem("avaxland:theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
